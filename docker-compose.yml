name: newsread

services:
  db:
    # pgvector build of Postgres 16 (same major, existing pgdata volume keeps working);
    # the vector extension powers semantic article search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: newsread
      POSTGRES_PASSWORD: newsread
      POSTGRES_DB: newsread
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsread"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Apache-2.0 S3-compatible storage for encrypted browser-history bodies and
  # AI-generated article images. `weed mini` runs a complete single-node
  # cluster and creates the history bucket at startup (the backend creates the
  # media bucket itself). Only the S3 endpoint is bound to the host, so the
  # images are served through the API rather than fetched by browsers.
  seaweedfs:
    image: chrislusf/seaweedfs:4.29
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-newsread-seaweedfs}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-newsread-seaweedfs-dev-secret}
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-newsread-history}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      NEWSREAD_DATABASE_URL: postgresql+asyncpg://newsread:newsread@db:5432/newsread
      NEWSREAD_REDIS_URL: redis://redis:6379/0
      # self_hosted (default) is single-user: signups close after the first
      # account and messaging integrations are hidden. staging/prod open both
      # and refuse to boot on the dev JWT secret. See .env.example.
      NEWSREAD_DEPLOYMENT: ${NEWSREAD_DEPLOYMENT:-self_hosted}
      NEWSREAD_JWT_SECRET: ${NEWSREAD_JWT_SECRET:-dev-secret-change-me}
      # Override in .env to add LAN origins, e.g. when testing the mobile
      # app's web build from a phone (http://<lan-ip>:8081). Native apps
      # (Expo Go / device builds) are unaffected — CORS is browser-only.
      NEWSREAD_CORS_ORIGINS: ${NEWSREAD_CORS_ORIGINS:-http://localhost:3000}
      # A set SEARXNG_BASE_URL in .env points at the host (localhost:8080),
      # but inside the compose network the instance lives at searxng:8080 —
      # rewrite it. Set NEWSREAD_SEARXNG_BASE_URL to use an external instance.
      NEWSREAD_SEARXNG_BASE_URL: ${NEWSREAD_SEARXNG_BASE_URL:-${SEARXNG_BASE_URL:+http://searxng:8080}}
      # Settings → Browser history serves the packaged Chrome extension from
      # the mounted repo directory (built there by `npm run build`). The
      # download link simply hides while the zip is absent.
      NEWSREAD_EXTENSION_PACKAGE: /extension/newsread-history-extension.zip
      NEWSREAD_BROWSER_HISTORY_CONTENT_ENABLED: ${NEWSREAD_BROWSER_HISTORY_CONTENT_ENABLED:-false}
      NEWSREAD_OBJECT_STORE_ENDPOINT: http://seaweedfs:8333
      NEWSREAD_OBJECT_STORE_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-newsread-seaweedfs}
      NEWSREAD_OBJECT_STORE_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-newsread-seaweedfs-dev-secret}
      NEWSREAD_OBJECT_STORE_BUCKET: ${SEAWEEDFS_BUCKET:-newsread-history}
      NEWSREAD_OBJECT_STORE_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET:-newsread-media}
      NEWSREAD_HISTORY_ENCRYPTION_MASTER_KEY: ${NEWSREAD_HISTORY_ENCRYPTION_MASTER_KEY:-}
    volumes:
      - ./extension:/extension:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    # Same .env as the backend: the worker is what actually calls the LLM
    # (summaries + embeddings), so it needs the OPENAI_* credentials too.
    env_file:
      - path: .env
        required: false
    environment:
      NEWSREAD_DATABASE_URL: postgresql+asyncpg://newsread:newsread@db:5432/newsread
      NEWSREAD_REDIS_URL: redis://redis:6379/0
      NEWSREAD_BROWSER_HISTORY_CONTENT_ENABLED: ${NEWSREAD_BROWSER_HISTORY_CONTENT_ENABLED:-false}
      NEWSREAD_OBJECT_STORE_ENDPOINT: http://seaweedfs:8333
      NEWSREAD_OBJECT_STORE_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-newsread-seaweedfs}
      NEWSREAD_OBJECT_STORE_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-newsread-seaweedfs-dev-secret}
      NEWSREAD_OBJECT_STORE_BUCKET: ${SEAWEEDFS_BUCKET:-newsread-history}
      NEWSREAD_OBJECT_STORE_MEDIA_BUCKET: ${SEAWEEDFS_MEDIA_BUCKET:-newsread-media}
      NEWSREAD_HISTORY_ENCRYPTION_MASTER_KEY: ${NEWSREAD_HISTORY_ENCRYPTION_MASTER_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Self-hosted web search for the Q&A agent (local alternative to Tavily).
  # Opt-in: docker compose --profile search up -d searxng
  # Then set SEARXNG_BASE_URL in .env (see .env.example).
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-secret-change-me}
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time. Override in .env when
        # serving behind a public domain (e.g. https://newsread.sharon8811.com,
        # whose nginx proxies /api to this backend on :8000).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  seaweeddata:
